name: Robot Update

on:
  schedule:
    # Runs every 6 minutes
    - cron: '*/7 * * * *'
  workflow_dispatch: # Keep this so you can still run it manually!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Updated to v5 to fix the Node.js warning
      - name: Checkout Repo
        uses: actions/checkout@v5 

      # Updated to v5 to fix the Node.js warning
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install feedparser requests

      - name: Run News Robot
        run: python fetch_news.py

      - name: Commit and Push
        run: |
          git config --global user.name "Robot"
          git config --global user.email "robot@onimugen.com"
          git add data_gaming.json
          git commit -m "Robot: Fresh news batch" || exit 0
          git push
