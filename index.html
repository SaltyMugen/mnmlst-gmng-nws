<!doctype html>
<html lang="en" data-theme="poden">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000" id="theme-color">
<meta name="color-scheme" content="dark light">
<script>
  // Saved theme before first paint, so the page never flashes the wrong colours.
  (function () {
    var bg = { poden: "#000000", mono: "#000000", blossom: "#ffedf5" };
    var t = localStorage.getItem("om-theme");
    if (!bg[t]) t = "poden";
    document.documentElement.dataset.theme = t;
    document.getElementById("theme-color").content = bg[t];
  })();
</script>
<title>OniMugen+ — Gaming News, Leaks & Rumours in One Feed</title>
<meta name="description" content="Gaming news, leaks and rumours from 45+ sources in one fast, compact feed. IGN, Kotaku, Eurogamer, VGC, Reddit leaks, Japanese press and more.">
<link rel="canonical" href="https://onimugen.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OniMugen+">
<meta property="og:url" content="https://onimugen.com/">
<meta property="og:title" content="OniMugen+ — Gaming News, Leaks & Rumours in One Feed">
<meta property="og:description" content="45+ sources. One feed. Gaming news, leaks and rumours, updated every 10 minutes.">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="data.json" as="fetch" crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<noscript><p class="empty">JavaScript is needed to load the feed.</p></noscript>

<header class="top">
  <div class="top-row">
    <button type="button" class="brand" id="refresh" title="Refresh">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11"/><path d="M12 7v10M7 12h10"/></svg>
      <span class="brand-text">OniMugen<i>+</i></span>
    </button>
    <span class="status" id="status" aria-live="polite"></span>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Search" aria-label="Search headlines" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <button type="button" class="icon" data-open="saved" title="Bookmarks" aria-label="Bookmarks">
        <svg viewBox="0 0 24 24"><path d="M18 21l-6-4-6 4V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button type="button" class="icon" data-open="settings" id="settings-btn" title="Sources, muted words and theme" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </div>
  <nav class="chips" id="filters" aria-label="Filter">
    <button type="button" class="chip on" data-f="all">All</button>
    <button type="button" class="chip" data-f="trending">Trending</button>
    <button type="button" class="chip" data-f="new">New</button>
    <button type="button" class="chip" data-f="rumour">Rumours</button>
    <button type="button" class="chip" data-f="playstation">PlayStation</button>
    <button type="button" class="chip" data-f="xbox">Xbox</button>
    <button type="button" class="chip" data-f="nintendo">Nintendo</button>
    <button type="button" class="chip" data-f="pc">PC</button>
    <button type="button" class="chip" data-f="jp">Japan</button>
  </nav>
</header>

<main>
  <div class="notice" id="notice" hidden></div>
  <ol class="feed" id="feed" aria-live="off"></ol>
  <p class="empty" id="empty" hidden>Nothing matches these filters.</p>
</main>

<footer>
  OniMugen+ collects headlines from 45+ sites. Every story belongs to its publisher.
</footer>

<button type="button" class="to-top" id="to-top" aria-label="Back to top">
  <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>
</button>

<div class="sheet-wrap" id="saved" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="saved-title">
    <div class="sheet-head">
      <h2 id="saved-title">Bookmarks</h2>
      <button type="button" class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <ul class="list" id="saved-list"></ul>
    <p class="empty" id="saved-empty">Bookmark a story and it will stay here.</p>
  </section>
</div>

<div class="sheet-wrap" id="settings" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h2 id="settings-title">Settings</h2>
      <button type="button" class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body">
      <h3>Theme</h3>
      <div class="segmented" id="themes" role="radiogroup" aria-label="Theme">
        <button type="button" data-t="poden" role="radio">Poden+</button>
        <button type="button" data-t="mono" role="radio">Mono</button>
        <button type="button" data-t="blossom" role="radio">Blossom</button>
      </div>

      <h3>Muted words</h3>
      <form class="field" id="mute-form">
        <input type="text" id="mute-input" placeholder="Hide headlines containing…" maxlength="60" autocomplete="off" aria-label="Word to mute">
        <button type="submit" class="pill">Mute</button>
      </form>
      <div class="tags-edit" id="mute-list"></div>

      <h3>Sources <span class="count" id="src-count"></span></h3>
      <div class="src-actions">
        <button type="button" class="link" data-all="show">Show all</button>
        <button type="button" class="link" data-all="hide">Hide all</button>
      </div>
      <ul class="list sources" id="src-list"></ul>
    </div>
  </section>
</div>
</body>
</html>
