<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OniMugen | Gaming — Real-Time Game News & Leaks</title>
    <meta name="description" content="OniMugen / Gaming : High-density aggregator for the latest gaming news, leaks, and industry rumors.">
    <meta name="keywords" content="Gaming News, Game Leaks, IGN, Kotaku, PC Gamer, Gaming Rumors, OniMugen">
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('om-theme') || 'day';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Micro+5&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <noscript>
      <style>.noscript-msg { padding: 40px; text-align: center; font-family: sans-serif; }</style>
      <div class="noscript-msg">JavaScript is required to load the news feed. Please enable it in your browser.</div>
    </noscript>
</head>
<body>
    <div id="splash" role="status" aria-live="polite" aria-label="Loading OniMugen Gaming">
      <div class="splash-title" aria-hidden="true">OniMugen</div>
      <div class="splash-track" aria-hidden="true"><div class="splash-fill" id="s-fill"></div></div>
    </div>

    <header id="main-header">
      <div class="header-inner">
          <h1>OniMugen+<span>Beta 0.5.2</span></h1>
          <div class="controls">
            <div class="expand-container">
                <button class="icon-btn" onclick="toggleControl('search')" title="Search" aria-label="Toggle search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <div id="search-wrap" class="expandable"><input type="text" id="search-input" placeholder="Search news..." oninput="applyFilters()" aria-label="Search news"></div>
            </div>
            <div class="expand-container">
                <button class="icon-btn" onclick="toggleControl('filter')" title="Filter" aria-label="Toggle filter">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
                </button>
                <div id="filter-wrap" class="expandable">
                    <div class="filter-options" role="group" aria-label="Filter articles">
                        <span class="filter-opt active" onclick="setFilter('all', this)" role="button" tabindex="0" aria-pressed="true">ALL</span>
                        <span class="filter-opt" onclick="setFilter('new', this)" role="button" tabindex="0" aria-pressed="false">NEW</span>
                        <span class="filter-opt" onclick="setFilter('hot', this)" role="button" tabindex="0" aria-pressed="false">HOT</span>
                    </div>
                </div>
            </div>
            <button class="icon-btn" onclick="hardRefresh()" title="Refresh" aria-label="Refresh feed">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            </button>
            <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle light/dark theme">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
          </div>
      </div>
    </header>

    <main><ul id="feed" aria-live="polite" aria-label="Gaming news feed"></ul></main>

    <footer><div class="footer-text">&copy; 2026 OniMugen. All content belongs to the respective creators and publishers.</div></footer>

    <script src="script.js"></script>
</body>
</html>
