<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OniMugen | Gaming — Real-Time Game News & Leaks</title>
<meta name="description" content="OniMugen / Gaming : High-density aggregator for the latest gaming news, leaks, and industry rumors.">
<meta name="keywords" content="Gaming News, Game Leaks, IGN, Kotaku, PC Gamer, Gaming Rumors, OniMugen">
<script>
    (function() {
        const savedTheme = localStorage.getItem('om-theme') || 'day';
        document.documentElement.setAttribute('data-theme', savedTheme);
    })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Micro+5&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<noscript>
  <style>.noscript-msg { padding: 40px; text-align: center; font-family: sans-serif; }</style>
  <div class="noscript-msg">JavaScript is required to load the news feed. Please enable it in your browser.</div>
</noscript>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[data-theme="day"] { 
    --bg: #fafaf8; --ink: #1a1916; --dim: #9a9690; --sub: #e4e1db; 
    --new-hl: rgba(214, 59, 47, 0.04); --hot-hl: rgba(0, 86, 179, 0.04); --hover-bg: #f1f0ec;
    --hover-ink: #0056b3; --header-bg: rgba(250, 250, 248, 0.95);
    --hot-bg: #007bff; --icon-color: #9a9690; --rumour: #f77f00;
}
[data-theme="night"] { 
    --bg: #111110; --ink: #dedad4; --dim: #55524e; --sub: #252422; 
    --new-hl: rgba(214, 59, 47, 0.1); --hot-hl: rgba(51, 154, 240, 0.08); --hover-bg: #1a1a19;
    --hover-ink: #4dabf7; --header-bg: rgba(17, 17, 16, 0.95);
    --hot-bg: #1971c2; --icon-color: #55524e; --rumour: #f77f00;
}

body { 
    background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; 
    max-width: 850px; margin: 0 auto; padding: 100px 20px 40px; 
    transition: background 0.3s ease, color 0.3s ease; 
}
header { 
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between; 
    padding: 12px 5%; background: var(--header-bg); backdrop-filter: blur(12px);
    border-bottom: 1px solid transparent; 
    transition: background 0.3s ease, border-color 0.3s ease, padding 0.3s ease;
}
header.scrolled { border-color: var(--sub); padding: 8px 5%; }
.header-inner { max-width: 810px; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; align-items: center; }
h1 { 
    font-family: 'Micro 5'; font-size: clamp(48px, 8vw, 58px); line-height: 0.8; 
    background: linear-gradient(to top, #FCBF49, #F77F00, #D62828, #003049); 
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
}
h1 span { 
    display: block; font-family: 'DM Sans'; font-size: 10px; letter-spacing: 2.5px; 
    color: var(--dim); text-transform: uppercase; -webkit-text-fill-color: var(--dim); margin-top: 2px;
}

.badge-jp {
    background: #000;
    color: #fff;
}

[data-theme="night"] .badge-jp {
    background: #dedad4; 
    color: #111110;        
}
#feed { list-style: none; }
.item { 
    display: grid; grid-template-columns: 35px 1fr 24px; gap: 12px; align-items: center; 
    padding: 0 8px; margin-bottom: 1px; border-radius: 3px;
    opacity: 0; transform: translateY(5px); transition: 0.2s ease, background 0.3s ease; 
}
.item.show { opacity: 1; transform: none; border-bottom: 1px solid var(--sub);}
.item.hidden { display: none; }
.item:hover { background: var(--hover-bg); }
.item:hover .item-body a { color: var(--hover-ink); }

/* --- SOURCE LOGO & PLACEHOLDER CSS --- */
.item-logo, .icon-placeholder { 
    width: 20px; height: 20px; object-fit: contain; opacity: 0.3; 
    filter: grayscale(100%); transition: all 0.2s ease; border-radius: 2px;
    background: transparent; 
}

.item:hover .item-logo,
.item:hover .icon-placeholder { filter: grayscale(0%); opacity: 1; }

[data-theme="night"] .item-logo,
[data-theme="night"] .icon-placeholder {
    filter: grayscale(100%) invert(1) brightness(0.7) drop-shadow(0 0 5px rgba(255, 255, 255, 0.05));
    opacity: 0.5;
    background: rgba(255, 255, 255, 0.03);
}

[data-theme="night"] .item:hover .item-logo,
[data-theme="night"] .item:hover .icon-placeholder {
    filter: grayscale(0%) invert(0%) brightness(1) drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
    opacity: 1;
    background: rgba(255, 255, 255, 0.08);
}

.icon-placeholder {
    background-color: #ffb347;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    text-transform: lowercase;
    color: #1a1916;
    flex-shrink: 0;
}
[data-theme="night"] .icon-placeholder { color: #fff; }

.item-logo.hidden { display: none; }
/* --- END SOURCE LOGO CSS --- */

.item[data-new="true"] { background: var(--new-hl); }
.item[data-hot="true"] { background: var(--hot-hl); }
.item-date { font-size: 10px; color: var(--dim); font-weight: 500; text-align: left; }
.item-body a { color: var(--ink); text-decoration: none; font-size: 16px; line-height: 1.2; transition: color 0.15s; font-weight: 400; }
.badge { font-size: 8px; font-weight: 800; color: #fff; padding: 1px 3px; border-radius: 2px; text-transform: uppercase; margin-left: 4px; vertical-align: middle; display: inline-block; }
.badge-new { background: #d63b2f; }
.badge-hot { background: var(--hot-bg); }
.badge-rumour { background: var(--rumour); }
.badge-ps { background: #006FCD; } 
.controls { display: flex; align-items: center; gap: 15px; }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--icon-color); display: flex; align-items: center; justify-content: center; transition: color 0.2s, opacity 0.2s; opacity: 0.8; }
.icon-btn:hover { color: var(--ink); opacity: 1; }
.icon-btn svg { width: 17px; height: 17px; pointer-events: none; }
.expand-container { display: flex; align-items: center; }
.expandable { max-width: 0; overflow: hidden; transition: max-width 0.4s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap; display: flex; align-items: center; }
.expandable.active { max-width: 200px; margin-left: 10px; }
#search-input { background: transparent; border: none; border-bottom: 1px solid var(--sub); color: var(--ink); font-family: 'DM Sans'; font-size: 13px; outline: none; padding: 2px 0; width: 140px; }
.filter-options { display: flex; gap: 12px; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--dim); }
.filter-opt { cursor: pointer; transition: 0.2s; }
.filter-opt.active { color: var(--ink); border-bottom: 1px solid var(--ink); }
#splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); transition: opacity 0.5s; }
#splash.fade { opacity: 0; pointer-events: none; }
.splash-title { font-family: 'Micro 5'; font-size: 60px; }
.splash-track { width: 200px; height: 1px; background: var(--sub); margin: 30px 0; overflow: hidden; }
.splash-fill { height: 100%; background: var(--ink); width: 0%; transition: width 0.3s; }
footer { margin-top: 60px; border-top: 1px solid var(--sub); padding: 30px 0; text-align: center; }
.footer-text { font-size: 10px; color: var(--dim); }
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite" aria-label="Loading OniMugen Gaming">
  <div class="splash-title" aria-hidden="true">OniMugen</div>
  <div class="splash-track" aria-hidden="true"><div class="splash-fill" id="s-fill"></div></div>
</div>
<header id="main-header">
  <div class="header-inner">
      <h1>OniMugen<span>Gaming</span></h1>
      <div class="controls">
        <div class="expand-container">
            <button class="icon-btn" onclick="toggleControl('search')" title="Search" aria-label="Toggle search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <div id="search-wrap" class="expandable"><input type="text" id="search-input" placeholder="Search news..." oninput="applyFilters()" aria-label="Search news"></div>
        </div>
        <div class="expand-container">
            <button class="icon-btn" onclick="toggleControl('filter')" title="Filter" aria-label="Toggle filter">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
            </button>
            <div id="filter-wrap" class="expandable">
                <div class="filter-options" role="group" aria-label="Filter articles">
                    <span class="filter-opt active" onclick="setFilter('all', this)" role="button" tabindex="0" aria-pressed="true">ALL</span>
                    <span class="filter-opt" onclick="setFilter('new', this)" role="button" tabindex="0" aria-pressed="false">NEW</span>
                    <span class="filter-opt" onclick="setFilter('hot', this)" role="button" tabindex="0" aria-pressed="false">HOT</span>
                </div>
            </div>
        </div>
        <button class="icon-btn" onclick="hardRefresh()" title="Refresh" aria-label="Refresh feed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle light/dark theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
  </div>
</header>
<main><ul id="feed" aria-live="polite" aria-label="Gaming news feed"></ul></main>
<footer><div class="footer-text">&copy; 2026 OniMugen. All content belongs to the respective creators and publishers.</div></footer>
<script>
// ─── Constants ────────────────────────────────────────────────────
const NEW_THRESHOLD_MS  = 15 * 60 * 1000;   // 15 minutes
const CUTOFF_MS         = 48 * 60 * 60 * 1000; // 48 hours (used for future age-gating)
const REFRESH_INTERVAL  = 5 * 60 * 1000;    // 5 minutes
const CACHE_KEY         = "onimugen_v1_gaming";

// ─── State ────────────────────────────────────────────────────────
let allArticles   = [];   // master copy of current articles
let currentFilter = 'all';
let lastDataHash  = null; // hash to detect real content changes

// ─── Utilities ────────────────────────────────────────────────────

function hashArticles(articles) {
    return articles.map(a => a.link + a.date).join('|');
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(String(str)));
    return div.innerHTML;
}

function safeDomain(url) {
    try {
        return new URL(url).hostname;
    } catch (_) {
        return '';
    }
}

function formatTime(ts) {
    const d = Date.now() - ts;
    if (d < 3600000)  return Math.floor(d / 60000)    + 'm';
    if (d < 86400000) return Math.floor(d / 3600000)  + 'h';
    return Math.floor(d / 86400000) + 'd';
}

// ─── Theme ────────────────────────────────────────────────────────
function toggleTheme() {
    const d    = document.documentElement;
    const next = d.getAttribute('data-theme') === 'day' ? 'night' : 'day';
    d.setAttribute('data-theme', next);
    localStorage.setItem('om-theme', next);
}

// ─── Controls ─────────────────────────────────────────────────────
function toggleControl(type) {
    const s = document.getElementById('search-wrap');
    const f = document.getElementById('filter-wrap');
    if (type === 'search') {
        f.classList.remove('active');
        s.classList.toggle('active');
        if (s.classList.contains('active')) document.getElementById('search-input').focus();
    } else {
        s.classList.remove('active');
        f.classList.toggle('active');
    }
}

function setFilter(t, el) {
    document.querySelectorAll('.filter-opt').forEach(opt => {
        opt.classList.remove('active');
        opt.setAttribute('aria-pressed', 'false');
    });
    el.classList.add('active');
    el.setAttribute('aria-pressed', 'true');
    currentFilter = t;
    applyFilters();
}

function applyFilters() {
    const q = document.getElementById('search-input').value.toLowerCase();
    document.querySelectorAll('.item').forEach(item => {
        const title       = item.getAttribute('data-title').toLowerCase();
        const matchSearch = title.includes(q);
        let   matchTab    = true;
        if (currentFilter === 'new') matchTab = item.getAttribute('data-new') === 'true';
        if (currentFilter === 'hot') matchTab = item.getAttribute('data-hot') === 'true';
        item.classList.toggle('hidden', !(matchSearch && matchTab));
    });
}

// ─── Scroll ───────────────────────────────────────────────────────
window.addEventListener('scroll', () => {
    document.getElementById('main-header')
        .classList.toggle('scrolled', window.pageYOffset > 20);
});

// ─── Keyboard: filter buttons ─────────────────────────────────────
document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('filter-opt')) {
        e.preventDefault();
        e.target.click();
    }
});

// ─── Render ───────────────────────────────────────────────────────
function render(articles) {
    allArticles = articles; 

    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    const slugCount = {};
    articles.forEach(a => {
        const domain = safeDomain(a.link);
        const slug   = domain + ':' + a.title.toLowerCase().replace(/[^\w]/g, '').substring(0, 40);
        slugCount[slug] = (slugCount[slug] || 0) + 1;
    });

    articles
        .slice() 
        .sort((a, b) => b.date - a.date)
        .forEach((a, i) => {
            const isNew    = (Date.now() - a.date) < NEW_THRESHOLD_MS;
            const domain   = safeDomain(a.link);
            const slug     = domain + ':' + a.title.toLowerCase().replace(/[^\w]/g, '').substring(0, 40);
            const isHot    = (a.hotScore != null) ? a.hotScore >= 2.0 : slugCount[slug] > 1;
            const isReddit = a.link.includes('reddit.com');
            const isPS     = a.link.includes('playstation.com');

            const li = document.createElement('li');
            li.className = 'item';
            li.setAttribute('data-title', a.title);
            li.setAttribute('data-new', isNew);
            li.setAttribute('data-hot', isHot);

            const dateSpan = document.createElement('span');
            dateSpan.className = 'item-date';
            dateSpan.textContent = formatTime(a.date);

            const body = document.createElement('div');
            body.className = 'item-body';

            const link = document.createElement('a');
            link.href   = a.link;
            link.target = '_blank';
            link.rel    = 'noopener noreferrer';
            link.textContent = a.title;

            if (isNew)    link.appendChild(makeBadge('New',      'badge-new'));
            if (isReddit) link.appendChild(makeBadge('Rumour',   'badge-rumour'));
            if (isPS)     link.appendChild(makeBadge('PlayStation', 'badge-ps'));
            if (isHot)    link.appendChild(makeBadge('Hot',      'badge-hot'));
            if (a.isTranslated) {
                link.appendChild(makeBadge('JP-EN', 'badge-jp'));
            }
            
            body.appendChild(link);

            const logoWrap = document.createElement('span');
            logoWrap.setAttribute('aria-hidden', 'true');
            logoWrap.style.display = 'flex';
            logoWrap.style.alignItems = 'center';
            logoWrap.style.justifyContent = 'center';

            const firstLetter = a.sourceName ? a.sourceName.charAt(0).toLowerCase() : '?';

            const img = document.createElement('img');
            img.className = 'item-logo';
            img.alt = '';
            
            const placeholder = document.createElement('div');
            placeholder.className = 'icon-placeholder';
            placeholder.textContent = firstLetter;
            placeholder.style.display = 'none';

            if (domain) {
                img.src = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;
                img.onload = function() {
                    if (this.naturalHeight <= 16) {
                        this.classList.add('hidden');
                        placeholder.style.display = 'flex';
                    }
                };
                img.onerror = function() {
                    this.classList.add('hidden');
                    placeholder.style.display = 'flex';
                };
            } else {
                img.classList.add('hidden');
                placeholder.style.display = 'flex';
            }

            logoWrap.appendChild(img);
            logoWrap.appendChild(placeholder);

            li.appendChild(dateSpan);
            li.appendChild(body);
            li.appendChild(logoWrap);
            feed.appendChild(li);

            setTimeout(() => li.classList.add('show'), i < 30 ? i * 15 : 0);
        });
}

function makeBadge(text, cls) {
    const b = document.createElement('span');
    b.className = `badge ${cls}`;
    b.textContent = text;
    return b;
}

// ─── Data fetching ────────────────────────────────────────────────
async function fetchFresh() {
    const r    = await fetch('./data_gaming.json?t=' + Date.now());
    if (!r.ok) throw new Error('Network response was not ok');
    return r.json();
}

async function init() {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
        try {
            const cachedData = JSON.parse(cached);
            allArticles  = cachedData;
            lastDataHash = hashArticles(cachedData);
            render(cachedData);
        } catch (_) {
            localStorage.removeItem(CACHE_KEY);
        }
        document.getElementById('splash').classList.add('fade');
    }

    try {
        const freshData = await fetchFresh();
        if (freshData && freshData.length > 0) {
            const freshHash = hashArticles(freshData);
            if (freshHash !== lastDataHash) {
                lastDataHash = freshHash;
                allArticles  = freshData;
                render(freshData);
                localStorage.setItem(CACHE_KEY, JSON.stringify(freshData));
            }
        }
    } catch (e) {
        console.warn('Fetch failed:', e.message);
    } finally {
        document.getElementById('s-fill').style.width = '100%';
        setTimeout(() => {
            const splash = document.getElementById('splash');
            splash.classList.add('fade');
            splash.setAttribute('aria-hidden', 'true');
        }, 300);
    }
}

function hardRefresh() {
    localStorage.removeItem(CACHE_KEY);
    lastDataHash = null;
    init();
}

async function silentRefresh() {
    try {
        const freshData = await fetchFresh();
        if (!freshData || freshData.length === 0) return;
        const freshHash = hashArticles(freshData);
        if (freshHash !== lastDataHash) {
            lastDataHash = freshHash;
            allArticles  = freshData;
            render(freshData);
            localStorage.setItem(CACHE_KEY, JSON.stringify(freshData));
        }
    } catch (e) {
        console.log('Silent refresh failed silently.');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    init();
    setInterval(silentRefresh, REFRESH_INTERVAL);
});
</script>
</body>
</html>
