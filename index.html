<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OniMugen | Gaming — Real-Time News</title>

<script>
    (function() {
        const savedTheme = localStorage.getItem('om-theme') || 'day';
        document.documentElement.setAttribute('data-theme', savedTheme);
    })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Micro+5&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ── THEMES ── */
[data-theme="day"] { 
    --bg: #fafaf8; --ink: #1a1916; --dim: #9a9690; --sub: #e4e1db; 
    --new-hl: rgba(214, 59, 47, 0.04); --hot-hl: rgba(0, 86, 179, 0.04); --hover-bg: #f1f0ec;
    --hover-ink: #0056b3; --header-bg: rgba(250, 250, 248, 0.95);
    --hot-bg: #007bff; --icon-color: #9a9690; --rumour: #f77f00;
}
[data-theme="night"] { 
    --bg: #111110; --ink: #dedad4; --dim: #55524e; --sub: #252422; 
    --new-hl: rgba(214, 59, 47, 0.1); --hot-hl: rgba(51, 154, 240, 0.08); --hover-bg: #1a1a19;
    --hover-ink: #4dabf7; --header-bg: rgba(17, 17, 16, 0.95);
    --hot-bg: #1971c2; --icon-color: #55524e; --rumour: #f77f00;
}

/* ── BASE ── */
body { 
    background: var(--bg); color: var(--ink); 
    font-family: 'DM Sans', sans-serif; max-width: 850px; margin: 0 auto; padding: 100px 20px 40px; 
    transition: background 0.3s ease, color 0.3s ease; 
}

header { 
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between; 
    padding: 12px 5%; background: var(--header-bg); backdrop-filter: blur(12px);
    transition: background 0.3s ease;
}

h1 { 
    font-family: 'Micro 5'; font-size: clamp(48px, 8vw, 58px); line-height: 0.8; 
    background: linear-gradient(to top, #FCBF49, #F77F00, #D62828, #003049); 
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
}

/* ── FEED & LOGOS ── */
#feed { list-style: none; }
.item { 
    display: grid; grid-template-columns: 35px 1fr 24px; gap: 12px; align-items: center; 
    padding: 2px 8px; margin-bottom: 1px; border-radius: 4px;
    opacity: 0; transform: translateY(5px); 
    transition: opacity 0.2s, transform 0.2s, background 0.3s ease; 
}
.item.show { opacity: 1; transform: none; }
.item.hidden { display: none; }
.item:hover { background: var(--hover-bg); cursor: pointer; }

/* LOGO FIX: Transitions from grey/faint to color/solid on hover */
.item-logo { 
    width: 24px; height: 24px; object-fit: cover; border-radius: 3px;
    opacity: 0.35; filter: grayscale(100%); 
    transition: filter 0.3s ease, opacity 0.3s ease; 
}
.item:hover .item-logo { 
    opacity: 1; filter: grayscale(0%); 
}

/* ── TYPOGRAPHY ── */
.item-date { font-size: 10px; color: var(--dim); font-weight: 500; }
.item-body a { color: var(--ink); text-decoration: none; font-size: 14px; transition: color 0.2s; }
.item:hover .item-body a { color: var(--hover-ink); }

.badge { font-size: 8px; font-weight: 800; color: #fff; padding: 1px 3px; border-radius: 2px; text-transform: uppercase; margin-left: 4px; vertical-align: middle; display: inline-block; }
.badge-new { background: #d63b2f; }
.badge-hot { background: var(--hot-bg); }

/* ── CONTROLS ── */
.controls { display: flex; align-items: center; gap: 12px; }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--icon-color); transition: color 0.2s; }
.icon-btn:hover { color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }

/* ── SPLASH ── */
#splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); transition: opacity 0.5s; }
#splash.fade { opacity: 0; pointer-events: none; }
.splash-track { width: 160px; height: 1px; background: var(--sub); margin: 20px 0; }
.splash-fill { height: 100%; background: var(--ink); width: 0%; transition: width 0.3s; }
</style>
</head>
<body>

<div id="splash">
    <div style="font-family:'Micro 5'; font-size: 60px;">OniMugen</div>
    <div class="splash-track"><div class="splash-fill" id="s-fill"></div></div>
</div>

<header>
    <div style="max-width:810px; width:100%; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
        <h1>OniMugen<span style="display:block; font-family:'DM Sans'; font-size:10px; color:var(--dim); letter-spacing:2px; text-transform:uppercase;">Gaming</span></h1>
        <div class="controls">
            <button class="icon-btn" onclick="hardRefresh()" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg></button>
            <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
        </div>
    </div>
</header>

<main><ul id="feed"></ul></main>

<script>
const CACHE_KEY = "onimugen_gaming_cache";

function toggleTheme() {
    const d = document.documentElement;
    const next = d.getAttribute('data-theme') === 'day' ? 'night' : 'day';
    d.setAttribute('data-theme', next);
    localStorage.setItem('om-theme', next);
}

function formatTime(ts) {
    const d = Date.now() - ts;
    if (d < 3600000) return Math.floor(d/60000) + 'm';
    if (d < 86400000) return Math.floor(d/3600000) + 'h';
    return Math.floor(d/86400000) + 'd';
}

function render(articles) {
    const feed = document.getElementById("feed");
    feed.innerHTML = "";
    articles.sort((a,b) => b.date - a.date).forEach((a, i) => {
        const isNew = (Date.now() - a.date) < 3600000;
        const li = document.createElement("li");
        li.className = "item";
        li.onclick = () => window.open(a.link, '_blank');
        li.innerHTML = `
            <span class="item-date">${formatTime(a.date)}</span>
            <div class="item-body">
                <a>${a.title} ${isNew ? '<span class="badge badge-new">New</span>' : ''}</a>
            </div>
            <img class="item-logo" src="https://www.google.com/s2/favicons?domain=${a.domain}&sz=32">
        `;
        feed.appendChild(li);
        setTimeout(() => li.classList.add("show"), i < 20 ? i * 20 : 0);
    });
}

async function init() {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
        render(JSON.parse(cached));
        document.getElementById("splash").classList.add("fade");
    }

    try {
        const r = await fetch('./data_gaming.json?t=' + Date.now());
        const data = await r.json();
        render(data);
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    } catch (e) {
        console.error("Robot data missing");
    } finally {
        document.getElementById("s-fill").style.width = "100%";
        setTimeout(() => document.getElementById("splash").classList.add("fade"), 300);
    }
}

function hardRefresh() {
    localStorage.removeItem(CACHE_KEY);
    location.reload();
}

window.onload = init;
</script>
</body>
</html>
