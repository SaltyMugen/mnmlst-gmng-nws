<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OniMugen | Gaming — Real-Time Game News & Leaks</title>
    <meta
      name="description"
      content="OniMugen / Gaming : High-density aggregator for the latest gaming news, leaks, and industry rumors." />
    <meta name="keywords" content="Gaming News, Game Leaks, IGN, Kotaku, PC Gamer, Gaming Rumors, OniMugen" />

    <script>
      (function () {
        const savedTheme = localStorage.getItem("om-theme") || "day";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Micro+5&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />

    <noscript>
      <style>
        .noscript-msg {
          padding: 40px;
          text-align: center;
          font-family: sans-serif;
        }
      </style>
      <div class="noscript-msg">JavaScript is required to load the news feed. Please enable it in your browser.</div>
    </noscript>
  </head>
  <body>
    <div id="splash">
      <div class="splash-title">OniMugen</div>
      <div class="splash-track"><div class="splash-fill" id="s-fill"></div></div>
    </div>

    <header id="main-header">
      <div class="header-inner">
        <h1 onclick="hardRefresh()" title="Refresh feed" style="cursor: pointer">OniMugen+<span>Build v0.5.3</span></h1>
        <div class="controls">
          <div class="expand-container">
            <button class="icon-btn" onclick="toggleControl('search')" title="Search">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
            <div id="search-wrap" class="expandable">
              <input type="text" id="search-input" placeholder="Search news..." oninput="applyFilters()" /><button
                id="search-clear"
                onclick="clearSearch()"
                tabindex="-1">
                &times;
              </button>
            </div>
          </div>
          <div class="expand-container">
            <button class="icon-btn" onclick="toggleControl('filter')" title="Filter">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round">
                <line x1="4" y1="21" x2="4" y2="14"></line>
                <line x1="4" y1="10" x2="4" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12" y2="3"></line>
                <line x1="20" y1="21" x2="20" y2="16"></line>
                <line x1="20" y1="12" x2="20" y2="3"></line>
                <line x1="1" y1="14" x2="7" y2="14"></line>
                <line x1="9" y1="8" x2="15" y2="8"></line>
                <line x1="17" y1="16" x2="23" y2="16"></line>
              </svg>
            </button>
            <div id="filter-wrap" class="expandable">
              <div class="filter-options">
                <span class="filter-opt active" onclick="setFilter('all', this)" role="button" tabindex="0">ALL</span>
                <span class="filter-opt" onclick="setFilter('new', this)" role="button" tabindex="0">NEW</span>
                <span class="filter-opt" onclick="setFilter('trending', this)" role="button" tabindex="0">TRENDING</span>
              </div>
            </div>
          </div>
          <button class="icon-btn" onclick="openBookmarks()" title="Bookmarks">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
          </button>
          <a id="bmc-btn" href="https://buymeacoffee.com/onimugen" target="_blank" rel="noopener noreferrer" title="Buy me a coffee">
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M20.216 6.415l-.132-.666c-.119-.598-.388-1.163-1.001-1.379-.197-.069-.42-.098-.57-.241-.152-.143-.196-.366-.231-.572-.065-.378-.125-.756-.192-1.133-.057-.325-.102-.69-.25-.987-.195-.4-.597-.634-.996-.788a5.723 5.723 0 00-.626-.194c-1-.263-2.05-.36-3.077-.416a25.834 25.834 0 00-3.7.062c-.915.083-1.88.184-2.75.5-.318.116-.646.256-.888.501-.297.302-.393.77-.177 1.146.154.267.415.456.692.58.36.162.737.284 1.123.366 1.075.238 2.189.331 3.287.37 1.218.05 2.437.01 3.65-.118.299-.033.598-.073.896-.119.352-.054.578-.513.474-.834-.124-.383-.457-.531-.834-.473-.466.074-.96.108-1.382.146-1.177.08-2.358.082-3.536.006a22.228 22.228 0 01-1.157-.107c-.086-.01-.18-.025-.258-.036-.243-.036-.484-.08-.724-.13-.111-.027-.111-.185 0-.212h.005c.277-.06.557-.108.838-.147h.002c.131-.009.263-.032.394-.048a25.076 25.076 0 013.426-.12c.674.019 1.347.067 2.017.144l.228.031c.267.04.533.088.798.145.392.085.818.226 1.134.497a.482.482 0 01.166.42l-.045.301c-.006.042-.026.063-.066.047a4.213 4.213 0 00-.498-.096 25.522 25.522 0 00-3.stroke-.062c-1.143-.018-2.286.04-3.423.15-.618.06-1.497.154-1.98.734-.199.243-.267.573-.235.88.03.295.166.578.38.78.293.271.683.445 1.072.567.369.114.75.194 1.135.252 1.021.152 2.056.195 3.086.17 1.043-.025 2.084-.122 3.115-.29.267-.044.53-.098.79-.159.426-.1.854-.219 1.233-.43.418-.233.787-.575.988-1.01.2-.435.194-.935.048-1.386a2.67 2.67 0 00-.21-.484zM7.717 10.669c-.002 0-.004.002-.004.004 0 .002.002.004.004.004h8.566c.002 0 .004-.002.004-.004 0-.002-.002-.004-.004-.004H7.717zm9.468 1.958H6.815a.8.8 0 00-.795.71l-.58 5.92a2 2 0 001.992 2.193h9.136a2 2 0 001.992-2.192l-.58-5.92a.8.8 0 00-.795-.711z"/>
            </svg>
          </a>
          <button id="theme-btn" onclick="cycleTheme()" title="Cycle theme">
            <div class="theme-dots">
              <div class="theme-dot" data-t="day"></div>
              <div class="theme-dot" data-t="night"></div>
              <div class="theme-dot" data-t="forest"></div>
            </div>
          </button>
        </div>
      </div>
    </header>

    <main>
      <div id="sources-filter-wrap">
        <button id="sources-btn" onclick="toggleSourcesMenu()">
          Hide Sources <span id="sources-muted-count"></span>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div id="sources-menu">
          <div id="sources-menu-inner"></div>
          <div id="sources-menu-footer">
            <button onclick="resetSources()" id="sources-reset">Show all</button>
          </div>
        </div>
      </div>
      <ul id="feed"></ul>
    </main>

    <footer>
      <div class="footer-text">
        &copy; 2026 OniMugen. All content belongs to the respective creators and publishers.
      </div>
    </footer>

    <div id="bookmarks-overlay" style="display: none">
      <div id="bookmarks-panel">
        <div id="bookmarks-header">
          <span id="bookmarks-title">Bookmarks</span>
          <button class="icon-btn" onclick="closeBookmarks()">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <ul id="bookmarks-feed"></ul>
        <div id="bookmarks-empty">No bookmarks yet.</div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
